<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - OMNIS</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">🧠</div>
            <h1>Accedi a OMNIS</h1>
            <p class="login-subtitle">Inserisci le tue credenziali per continuare</p>
            
            <div class="login-error" id="loginError">⚠️ Credenziali non valide. Riprova.</div>
            
            <form class="login-form" id="loginForm" onsubmit="handleLogin(event)" autocomplete="off">
                <div class="form-group">
                    <label>Username o Email</label>
                    <input type="text" id="username" class="input-field" placeholder="Il tuo username" required autocomplete="off" name="omnis-username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="input-field" placeholder="••••••••" required autocomplete="off" name="omnis-password">
                </div>
                <button type="submit" class="btn-login" id="loginBtn">Accedi</button>
            </form>
            
            <p class="login-footer">
                Non hai un account? <a href="register.html">Registrati gratis</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
