<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati - OMNIS</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">🧠</div>
            <h1>Crea il tuo account</h1>
            <p class="login-subtitle">Registrati gratuitamente per iniziare</p>
            
            <div class="login-error" id="registerError"></div>
            
            <form class="login-form" id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" class="input-field" placeholder="Scegli un username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" class="input-field" placeholder="nome@esempio.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" class="input-field" placeholder="Minimo 6 caratteri" required autocomplete="new-password" minlength="6">
                </div>
                <div class="form-group">
                    <label>Conferma Password</label>
                    <input type="password" id="regConfirmPassword" class="input-field" placeholder="Ripeti la password" required autocomplete="new-password" minlength="6">
                </div>
                <button type="submit" class="btn-login" id="registerBtn">📝 Registrati</button>
            </form>
            
            <p class="login-footer">
                Hai già un account? <a href="login.html">Accedi</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
